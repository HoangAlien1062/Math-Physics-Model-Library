<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô phỏng Con lắc đơn & Dao động điều hòa</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: monospace;
      border: 1px solid #bae6fd;
    }
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }
    .canvas-container {
      flex: 1;
      position: relative;
      background: #ffffff;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .sidebar {
      width: 320px;
      background: var(--card);
      border-left: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .control-val {
      font-family: monospace;
      color: var(--primary);
      font-weight: 700;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .stats-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-val { font-weight: 600; }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    button:hover { opacity: 0.9; }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; overflow-y: auto; height: auto; }
      .canvas-container { height: 350px; min-height: 350px; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Con lắc đơn - Dao động điều hòa</h1>
      <p>Kéo quả nặng để thả góc ban đầu hoặc dùng thanh trượt</p>
    </div>
    <div class="badge" id="periodBadge">T ≈ 2.01 s</div>
  </header>

  <div class="main-container">
    <div class="canvas-container" id="canvasBox">
      <canvas id="pendulumCanvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="control-group">
        <div class="control-label">
          <span>Chiều dài dây L (m):</span>
          <span class="control-val" id="valL">1.0 m</span>
        </div>
        <input type="range" id="paramL" min="0.4" max="2.5" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Gia tốc trọng trường g (m/s²):</span>
          <span class="control-val" id="valG">9.8 m/s²</span>
        </div>
        <input type="range" id="paramG" min="1.6" max="24.8" step="0.2" value="9.8">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Ma sát / Cản khí γ:</span>
          <span class="control-val" id="valDamping">0.05</span>
        </div>
        <input type="range" id="paramDamping" min="0.0" max="0.3" step="0.01" value="0.05">
      </div>

      <div class="stats-card">
        <div class="stat-row">
          <span>Góc lệch θ:</span>
          <span class="stat-val" id="thetaDisplay">0.0°</span>
        </div>
        <div class="stat-row">
          <span>Vận tốc góc ω:</span>
          <span class="stat-val" id="omegaDisplay">0.00 rad/s</span>
        </div>
        <div class="stat-row">
          <span>Chu kỳ dao động nhỏ:</span>
          <span class="stat-val" id="periodDisplay">2.01 s</span>
        </div>
        <div class="stat-row">
          <span>Tần số dao động f:</span>
          <span class="stat-val" id="freqDisplay">0.50 Hz</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="pauseBtn">Tạm dừng</button>
        <button class="btn-secondary" id="resetBtn">Thả góc 30°</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'MODEL_READY', model: 'harmonic-pendulum' }, '*');
        }
      } catch (e) {}
    });

    const canvas = document.getElementById('pendulumCanvas');
    const ctx = canvas.getContext('2d');
    const paramL = document.getElementById('paramL');
    const paramG = document.getElementById('paramG');
    const paramDamping = document.getElementById('paramDamping');
    const valL = document.getElementById('valL');
    const valG = document.getElementById('valG');
    const valDamping = document.getElementById('valDamping');
    const periodBadge = document.getElementById('periodBadge');
    const thetaDisplay = document.getElementById('thetaDisplay');
    const omegaDisplay = document.getElementById('omegaDisplay');
    const periodDisplay = document.getElementById('periodDisplay');
    const freqDisplay = document.getElementById('freqDisplay');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Physics parameters
    let L = 1.0;
    let g = 9.8;
    let damping = 0.05;
    let theta = Math.PI / 6; // 30 deg
    let omega = 0.0;
    let isPaused = false;
    let isDragging = false;

    // View coordinates
    let pivotX = 0;
    let pivotY = 60;
    let pixelScale = 180; // px per meter
    let bobRadius = 18;

    function resize() {
      const box = document.getElementById('canvasBox');
      canvas.width = box.clientWidth * window.devicePixelRatio;
      canvas.height = box.clientHeight * window.devicePixelRatio;
      pivotX = canvas.width / 2;
      pivotY = 50 * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);

    function updateParams() {
      L = parseFloat(paramL.value);
      g = parseFloat(paramG.value);
      damping = parseFloat(paramDamping.value);

      valL.textContent = `${L.toFixed(1)} m`;
      valG.textContent = `${g.toFixed(1)} m/s²`;
      valDamping.textContent = damping.toFixed(2);

      const T = 2 * Math.PI * Math.sqrt(L / g);
      periodBadge.textContent = `T ≈ ${T.toFixed(2)} s`;
      periodDisplay.textContent = `${T.toFixed(2)} s`;
      freqDisplay.textContent = `${(1 / T).toFixed(2)} Hz`;
    }

    [paramL, paramG, paramDamping].forEach(el => el.addEventListener('input', updateParams));

    // Mouse / Touch Dragging
    function getBobPos() {
      const dpr = window.devicePixelRatio || 1;
      const lengthPx = L * pixelScale * dpr;
      const bobX = pivotX + lengthPx * Math.sin(theta);
      const bobY = pivotY + lengthPx * Math.cos(theta);
      return { x: bobX, y: bobY };
    }

    function checkDrag(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const mx = (clientX - rect.left) * dpr;
      const my = (clientY - rect.top) * dpr;
      const bob = getBobPos();
      const dist = Math.hypot(mx - bob.x, my - bob.y);
      return dist <= (bobRadius * dpr + 15);
    }

    function handlePointerDown(e) {
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);
      if (checkDrag(x, y)) {
        isDragging = true;
        omega = 0;
      }
    }

    function handlePointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const mx = (x - rect.left) * dpr;
      const my = (y - rect.top) * dpr;

      theta = Math.atan2(mx - pivotX, my - pivotY);
      omega = 0;
    }

    function handlePointerUp() {
      isDragging = false;
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown, { passive: true });
    window.addEventListener('touchmove', handlePointerMove, { passive: true });
    window.addEventListener('touchend', handlePointerUp);

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Tiếp tục' : 'Tạm dừng';
    });

    resetBtn.addEventListener('click', () => {
      theta = Math.PI / 6;
      omega = 0;
    });

    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!isPaused && !isDragging) {
        // Simple harmonic / pendulum physics: d2theta/dt2 = -(g/L)*sin(theta) - damping*omega
        const alpha = -(g / L) * Math.sin(theta) - damping * omega;
        omega += alpha * dt;
        theta += omega * dt;
      }

      // Update UI displays
      const deg = (theta * 180 / Math.PI).toFixed(1);
      thetaDisplay.textContent = `${deg}°`;
      omegaDisplay.textContent = `${omega.toFixed(2)} rad/s`;

      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      const dpr = window.devicePixelRatio || 1;

      ctx.clearRect(0, 0, w, h);

      // Draw Support Ceiling
      ctx.fillStyle = '#334155';
      ctx.fillRect(pivotX - 60 * dpr, pivotY - 10 * dpr, 120 * dpr, 10 * dpr);

      // Draw Pivot
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, 6 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // Bob position
      const bob = getBobPos();

      // Draw String
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(bob.x, bob.y);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2.5 * dpr;
      ctx.stroke();

      // Dashed vertical reference line
      ctx.setLineDash([4 * dpr, 4 * dpr]);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1 * dpr;
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(pivotX, pivotY + L * pixelScale * dpr + 30 * dpr);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Angle Arc
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, 40 * dpr, Math.PI / 2, Math.PI / 2 + theta, theta < 0);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2 * dpr;
      ctx.stroke();

      // Draw Bob
      ctx.beginPath();
      ctx.arc(bob.x, bob.y, bobRadius * dpr, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(bob.x - 4 * dpr, bob.y - 4 * dpr, 2 * dpr, bob.x, bob.y, bobRadius * dpr);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(1, '#0284c7');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5 * dpr;
      ctx.stroke();
    }

    resize();
    updateParams();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
