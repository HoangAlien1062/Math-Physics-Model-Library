<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khảo sát đồ thị hàm số bậc hai y = ax² + bx + c</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .formula-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1.05rem;
      font-family: "Courier New", Courier, monospace;
      border: 1px solid #bfdbfe;
    }
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }
    .canvas-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      cursor: crosshair;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sidebar {
      width: 320px;
      background: var(--card);
      border-left: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .control-val {
      font-family: monospace;
      color: var(--primary);
      font-weight: 700;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-val { font-weight: 600; color: var(--text); }
    .btn-reset {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: #1d4ed8; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; overflow-y: auto; height: auto; }
      .canvas-wrapper { height: 350px; min-height: 350px; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Hàm số bậc hai: Parabol</h1>
      <p>Khảo sát đỉnh, trục đối xứng & nghiệm thời gian thực</p>
    </div>
    <div class="formula-badge" id="formulaDisplay">y = 1.0x² + 0.0x - 2.0</div>
  </header>

  <div class="main-container">
    <div class="canvas-wrapper" id="canvasBox">
      <canvas id="plotCanvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="control-group">
        <div class="control-label">
          <span>Hệ số a (Độ cong):</span>
          <span class="control-val" id="valA">1.0</span>
        </div>
        <input type="range" id="paramA" min="-3" max="3" step="0.1" value="1">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Hệ số b (Dịch ngang):</span>
          <span class="control-val" id="valB">0.0</span>
        </div>
        <input type="range" id="paramB" min="-6" max="6" step="0.2" value="0">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Hệ số c (Tung độ gốc):</span>
          <span class="control-val" id="valC">-2.0</span>
        </div>
        <input type="range" id="paramC" min="-8" max="8" step="0.5" value="-2">
      </div>

      <div class="stat-card">
        <div class="stat-row">
          <span>Đỉnh I (xv; yv):</span>
          <span class="stat-val" id="vertexDisplay">(0.00, -2.00)</span>
        </div>
        <div class="stat-row">
          <span>Trục đối xứng:</span>
          <span class="stat-val" id="axisDisplay">x = 0.00</span>
        </div>
        <div class="stat-row">
          <span>Biệt thức Δ:</span>
          <span class="stat-val" id="deltaDisplay">8.00</span>
        </div>
        <div class="stat-row">
          <span>Nghiệm f(x) = 0:</span>
          <span class="stat-val" id="rootsDisplay">x₁ = -1.41, x₂ = 1.41</span>
        </div>
      </div>

      <button class="btn-reset" id="resetBtn">Đặt lại mặc định</button>
    </div>
  </div>

  <script>
    // Tell parent frame that model is ready
    window.addEventListener('load', () => {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'MODEL_READY', model: 'quadratic-function' }, '*');
        }
      } catch (e) {}
    });

    const canvas = document.getElementById('plotCanvas');
    const ctx = canvas.getContext('2d');
    const paramA = document.getElementById('paramA');
    const paramB = document.getElementById('paramB');
    const paramC = document.getElementById('paramC');
    const valA = document.getElementById('valA');
    const valB = document.getElementById('valB');
    const valC = document.getElementById('valC');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const vertexDisplay = document.getElementById('vertexDisplay');
    const axisDisplay = document.getElementById('axisDisplay');
    const deltaDisplay = document.getElementById('deltaDisplay');
    const rootsDisplay = document.getElementById('rootsDisplay');
    const resetBtn = document.getElementById('resetBtn');

    let scale = 40; // pixels per unit
    let originX = 0;
    let originY = 0;

    function resizeCanvas() {
      const box = document.getElementById('canvasBox');
      canvas.width = box.clientWidth * window.devicePixelRatio;
      canvas.height = box.clientHeight * window.devicePixelRatio;
      originX = canvas.width / 2;
      originY = canvas.height / 2;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function update() {
      let a = parseFloat(paramA.value);
      if (a === 0) a = 0.05; // avoid division by zero
      const b = parseFloat(paramB.value);
      const c = parseFloat(paramC.value);

      valA.textContent = a.toFixed(1);
      valB.textContent = b.toFixed(1);
      valC.textContent = c.toFixed(1);

      // Format formula
      const signB = b >= 0 ? `+ ${b.toFixed(1)}` : `- ${Math.abs(b).toFixed(1)}`;
      const signC = c >= 0 ? `+ ${c.toFixed(1)}` : `- ${Math.abs(c).toFixed(1)}`;
      formulaDisplay.textContent = `y = ${a.toFixed(1)}x² ${signB}x ${signC}`;

      // Vertex
      const xv = -b / (2 * a);
      const yv = a * xv * xv + b * xv + c;
      vertexDisplay.textContent = `(${xv.toFixed(2)}, ${yv.toFixed(2)})`;
      axisDisplay.textContent = `x = ${xv.toFixed(2)}`;

      // Discriminant
      const delta = b * b - 4 * a * c;
      deltaDisplay.textContent = delta.toFixed(2);

      if (delta > 0) {
        const x1 = (-b - Math.sqrt(delta)) / (2 * a);
        const x2 = (-b + Math.sqrt(delta)) / (2 * a);
        rootsDisplay.textContent = `x₁ = ${x1.toFixed(2)}, x₂ = ${x2.toFixed(2)}`;
      } else if (Math.abs(delta) < 0.0001) {
        const x0 = -b / (2 * a);
        rootsDisplay.textContent = `Nghiệm kép x = ${x0.toFixed(2)}`;
      } else {
        rootsDisplay.textContent = 'Vô nghiệm (Δ < 0)';
      }

      draw();
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      const dpr = window.devicePixelRatio || 1;
      const s = scale * dpr;

      ctx.clearRect(0, 0, w, h);

      // Grid
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#e2e8f0';
      ctx.font = `${11 * dpr}px sans-serif`;
      ctx.fillStyle = '#94a3b8';

      // Vertical lines
      for (let x = originX % s; x < w; x += s) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();

        const unit = Math.round((x - originX) / s);
        if (unit !== 0) {
          ctx.fillText(unit, x - 5 * dpr, originY + 15 * dpr);
        }
      }

      // Horizontal lines
      for (let y = originY % s; y < h; y += s) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();

        const unit = Math.round((originY - y) / s);
        if (unit !== 0) {
          ctx.fillText(unit, originX + 6 * dpr, y + 4 * dpr);
        }
      }

      // Main Axes
      ctx.lineWidth = 2 * dpr;
      ctx.strokeStyle = '#334155';
      ctx.beginPath();
      // X-axis
      ctx.moveTo(0, originY);
      ctx.lineTo(w, originY);
      // Y-axis
      ctx.moveTo(originX, 0);
      ctx.lineTo(originX, h);
      ctx.stroke();

      // Axis labels
      ctx.fillStyle = '#1e293b';
      ctx.font = `bold ${12 * dpr}px sans-serif`;
      ctx.fillText('x', w - 18 * dpr, originY - 8 * dpr);
      ctx.fillText('y', originX + 8 * dpr, 18 * dpr);
      ctx.fillText('O', originX - 14 * dpr, originY + 14 * dpr);

      // Plot Parabola
      const a = parseFloat(paramA.value) || 0.01;
      const b = parseFloat(paramB.value);
      const c = parseFloat(paramC.value);

      ctx.beginPath();
      ctx.lineWidth = 3 * dpr;
      ctx.strokeStyle = '#2563eb';

      let started = false;
      for (let px = 0; px <= w; px += 2) {
        const xMath = (px - originX) / s;
        const yMath = a * xMath * xMath + b * xMath + c;
        const py = originY - yMath * s;

        if (!started) {
          ctx.moveTo(px, py);
          started = true;
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.stroke();

      // Draw Axis of Symmetry
      const xv = -b / (2 * a);
      const pxv = originX + xv * s;
      ctx.setLineDash([4 * dpr, 4 * dpr]);
      ctx.lineWidth = 1.5 * dpr;
      ctx.strokeStyle = '#9333ea';
      ctx.beginPath();
      ctx.moveTo(pxv, 0);
      ctx.lineTo(pxv, h);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Vertex Point
      const yv = a * xv * xv + b * xv + c;
      const pyv = originY - yv * s;
      ctx.beginPath();
      ctx.arc(pxv, pyv, 6 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = '#dc2626';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * dpr;
      ctx.stroke();
    }

    [paramA, paramB, paramC].forEach(el => el.addEventListener('input', update));
    resetBtn.addEventListener('click', () => {
      paramA.value = '1';
      paramB.value = '0';
      paramC.value = '-2';
      update();
    });

    resizeCanvas();
    update();
  </script>
</body>
</html>
